[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-classification-benchmark"
version = "0.1.0"
description = "Leakage-resistant benchmark for grouped sensor classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.7,<4", "seaborn>=0.12,<1", "PyYAML>=6,<7", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "ipykernel>=6,<8"]

[project.scripts]
sensor-benchmark = "sensor_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E501"]
